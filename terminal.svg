<text class="l" x="28" y="232" xml:space="preserve" style="animation-delay:1.20s"><tspan fill="#e6edf3">  </tspan><tspan fill="#79c0ff">production      </tspan><tspan fill="#e6edf3">LLM features that run on real customer conversations</tspan></text>
<text class="l" x="28" y="253" xml:space="preserve" style="animation-delay:1.31s"><tspan fill="#e6edf3">  </tspan><tspan fill="#79c0ff">reliability     </tspan><tspan fill="#e6edf3">making them hold up on long, messy inputs</tspan></text>
<text class="l" x="28" y="274" xml:space="preserve" style="animation-delay:1.42s"><tspan fill="#e6edf3">  </tspan><tspan fill="#79c0ff">speech          </tspan><tspan fill="#e6edf3">Arabic speech systems</tspan></text>
<text class="l" x="28" y="295" xml:space="preserve" style="animation-delay:1.53s"><tspan fill="#e6edf3">  </tspan><tspan fill="#79c0ff">mentoring       </tspan><tspan fill="#e6edf3">helping others get started with LLM apps</tspan></text>
<text class="l" x="28" y="337" xml:space="preserve" style="animation-delay:1.64s"><tspan fill="#7ee787">ammarhassona</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#79c0ff">github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3">ls -l open-source/</tspan></text>
