<text class="l" x="28" y="85" xml:space="preserve" style="animation-delay:0.48s"><tspan fill="#e6edf3" class="b">Ammar Hassona</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#d2a8ff">AI/ML Engineer</tspan></text>
