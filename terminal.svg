<text class="l" x="28" y="148" xml:space="preserve" style="animation-delay:0.87s"><tspan fill="#e6edf3">I like making things faster and understanding why they work.</tspan></text>
<text class="l" x="28" y="190" xml:space="preserve" style="animation-delay:0.98s"><tspan fill="#8b949e">I've built LLM systems end to end:</tspan></text>
